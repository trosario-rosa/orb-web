<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>User Administration API - Swagger UI</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5.33.1/swagger-ui.css">
  <style>
    body { margin: 0; }
    .swagger-ui .generation-controls { width: 100%; }
    .swagger-ui .generation-buttons { display: flex; flex-wrap: wrap; gap: 12px; }
    .swagger-ui .generation-status { margin-top: 16px; padding: 16px; border: 1px solid #b6c7d1; border-radius: 4px; background: #fff; text-align: left; }
    .swagger-ui .generation-status strong { display: block; font-size: 20px; }
    .swagger-ui .generation-status progress { display: block; width: 100%; height: 20px; margin-top: 12px; accent-color: #137547; }
    .swagger-ui .generation-status p { margin: 10px 0 0; }
    .swagger-ui .generation-status[data-phase="error"] { border-color: #b42318; color: #8c1d14; }
  </style>
</head>
<body>
  <div id="swagger-ui"></div>
  <script src="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5.33.1/swagger-ui-bundle.js"></script>
  <script src="./docs-assets/generation.js"></script>
</body>
</html>
